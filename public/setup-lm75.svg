  <text x="815.7" y="352.7" text-anchor="end" font-size="12" fill="#555">CJMCU-75, from its back: A0-A2 soldered to GND</text>
  <g font-size="12" fill="#333">
    <text x="20" y="410">Yellow jumper on I2C, green on 3V3 (at 5 V the LM75 wants 3.5 V for a high), both before plugging in USB.</text>
    <text x="20" y="430">Four wires: VCC, GND, SDA and SCL, those two crossing; OS (its thermal watchdog's output) stays free.</text>
    <text x="20" y="450">On its back, bridge each of A0, A1, A2 to its GND pad with solder (0x48): left open, its address drifts and it drops out.</text>
  </g>

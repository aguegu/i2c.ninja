  <title>A CH341T 2-in-1 dongle, yellow jumper on I2C and green on 3V3, wired to a purple LM75 module (CJMCU-75) seen from its back: VCC to VCC, GND to GND, SDA to SDA and SCL to SCL, those two crossing; OS left free</title>

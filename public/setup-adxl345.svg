<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 893 450" width="893" height="450" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A CH341T dongle in I2C mode at 3.3V wired to an ADXL345 breakout: VCC to VIN, GND to GND, SCL to SCL, SDA to SDA; 3V3, CS, INT1, INT2, SDO free</title>

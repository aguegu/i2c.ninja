<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A CH341T dongle in I2C mode at 3.3V wired to an ADXL345 breakout: VCC to VIN, GND to GND, SCL to SCL, SDA to SDA; 3V3, CS, INT1, INT2, SDO free</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ecef"/>
      <stop offset="0.5" stop-color="#b8bec5"/>
      <stop offset="1" stop-color="#d9dde1"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d77a"/>
      <stop offset="1" stop-color="#b8922a"/>
    </linearGradient>
    <g id="dupont">
      <rect x="0" y="-6" width="20" height="12" rx="1.5" fill="#1b1b1b"/>
      <rect x="2" y="-2" width="4" height="4" fill="#444"/>
    </g>
  </defs>

  <rect class="bg" width="860" height="450" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">CH341T (I2C mode, 3.3V) + ADXL345 breakout</text>

  <!-- USB-A plug -->
  <text x="70" y="160" text-anchor="middle" font-size="12" fill="#555">to the PC</text>
  <rect x="20" y="170" width="100" height="90" rx="3" fill="url(#metal)" stroke="#8a9096"/>
  <rect x="38" y="190" width="16" height="12" fill="#6b7178"/>
  <rect x="38" y="228" width="16" height="12" fill="#6b7178"/>

  <!-- the dongle's PCB -->
  <rect x="118" y="125" width="340" height="180" rx="8" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <text x="130" y="318" font-size="12" fill="#555">CH341T 2-in-1 module (USB to I2C / TTL)</text>

  <!-- LEDs -->
  <rect x="134" y="140" width="10" height="7" fill="#f1f1f1" stroke="#999"/>
  <text x="150" y="147" font-size="9" fill="#fff">RDY</text>
  <rect x="134" y="282" width="10" height="7" fill="#f1f1f1" stroke="#999"/>
  <text x="150" y="289" font-size="9" fill="#fff">TNOW</text>

  <!-- crystal, chip -->
  <rect x="160" y="196" width="72" height="30" rx="14" fill="url(#metal)" stroke="#8a9096"/>
  <text x="196" y="215" text-anchor="middle" font-size="8" fill="#555">12.000</text>
  <g fill="#c9ccd1">
    <rect x="252" y="176" width="3" height="8"/><rect x="259" y="176" width="3" height="8"/><rect x="266" y="176" width="3" height="8"/><rect x="273" y="176" width="3" height="8"/><rect x="280" y="176" width="3" height="8"/>
    <rect x="287" y="176" width="3" height="8"/><rect x="294" y="176" width="3" height="8"/><rect x="301" y="176" width="3" height="8"/><rect x="308" y="176" width="3" height="8"/><rect x="315" y="176" width="3" height="8"/>
    <rect x="252" y="236" width="3" height="8"/><rect x="259" y="236" width="3" height="8"/><rect x="266" y="236" width="3" height="8"/><rect x="273" y="236" width="3" height="8"/><rect x="280" y="236" width="3" height="8"/>
    <rect x="287" y="236" width="3" height="8"/><rect x="294" y="236" width="3" height="8"/><rect x="301" y="236" width="3" height="8"/><rect x="308" y="236" width="3" height="8"/><rect x="315" y="236" width="3" height="8"/>
  </g>
  <rect x="248" y="183" width="74" height="54" rx="2" fill="#1d1d1d"/>
  <text x="285" y="214" text-anchor="middle" font-size="10" fill="#ccc">CH341T</text>

  <!-- mode jumper (yellow): TTL | I2C, the cap on I2C -->
  <text x="340" y="141" text-anchor="middle" font-size="9" fill="#fff">TTL</text>
  <text x="380" y="141" text-anchor="middle" font-size="9" fill="#fff">I2C</text>
  <g fill="#111"><rect x="333" y="147" width="14" height="14"/><rect x="353" y="147" width="14" height="14"/><rect x="373" y="147" width="14" height="14"/></g>
  <circle cx="340" cy="154" r="3" fill="url(#pin)"/>
  <rect x="351" y="144" width="38" height="20" rx="3" fill="#f2c200" stroke="#a88600"/>
  <rect x="361" y="150" width="18" height="8" rx="2" fill="#d8ac00"/>

  <!-- voltage jumper (green): 3V3 | 5V, the cap on 3V3 -->
  <g fill="#111"><rect x="333" y="262" width="14" height="14"/><rect x="353" y="262" width="14" height="14"/><rect x="373" y="262" width="14" height="14"/></g>
  <circle cx="380" cy="269" r="3" fill="url(#pin)"/>
  <rect x="331" y="259" width="38" height="20" rx="3" fill="#2fa36b" stroke="#1d6e47"/>
  <rect x="341" y="265" width="18" height="8" rx="2" fill="#268a5a"/>
  <text x="340" y="293" text-anchor="middle" font-size="9" fill="#fff">3V3</text>
  <text x="380" y="293" text-anchor="middle" font-size="9" fill="#fff">5V</text>

  <!-- the dongle's header: top to bottom RXD TXD SDA SCL GND VCC -->
  <rect x="432" y="138" width="22" height="144" fill="#161616"/>
  <g font-size="11" fill="#fff" text-anchor="end" font-family="Menlo, Consolas, monospace">
    <text x="426" y="154">RXD</text><text x="426" y="178">TXD</text><text x="426" y="202">SDA</text>
    <text x="426" y="226">SCL</text><text x="426" y="250">GND</text><text x="426" y="274">VCC</text>
  </g>
  <g fill="url(#pin)">
    <rect x="443" y="148" width="34" height="4"/><rect x="443" y="172" width="34" height="4"/><rect x="443" y="196" width="34" height="4"/>
    <rect x="443" y="220" width="34" height="4"/><rect x="443" y="244" width="34" height="4"/><rect x="443" y="268" width="34" height="4"/>
  </g>


  <!-- the ADXL345 breakout (blue: pins VIN 3V3 GND CS INT1 INT2 SDO SDA SCL along one edge, two mounting holes on the other), turned a quarter clockwise so its pins face the dongle: its X arrow now points down, Y right, Z out of the board -->
  <rect x="612" y="96" width="196" height="252" rx="8" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <circle cx="782" cy="122" r="12" fill="#fff" stroke="#d9b44a" stroke-width="5"/>
  <circle cx="782" cy="322" r="12" fill="#fff" stroke="#d9b44a" stroke-width="5"/>
  <g fill="#d9b44a" stroke="#a88600"><circle cx="624" cy="126" r="7"/><circle cx="624" cy="150" r="7"/><circle cx="624" cy="174" r="7"/><circle cx="624" cy="198" r="7"/><circle cx="624" cy="222" r="7"/><circle cx="624" cy="246" r="7"/><circle cx="624" cy="270" r="7"/><circle cx="624" cy="294" r="7"/><circle cx="624" cy="318" r="7"/></g>
  <g fill="url(#pin)"><rect x="593" y="124" width="34" height="4"/><rect x="593" y="148" width="34" height="4"/><rect x="593" y="172" width="34" height="4"/><rect x="593" y="196" width="34" height="4"/><rect x="593" y="220" width="34" height="4"/><rect x="593" y="244" width="34" height="4"/><rect x="593" y="268" width="34" height="4"/><rect x="593" y="292" width="34" height="4"/><rect x="593" y="316" width="34" height="4"/></g>
  <g font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace"><text x="638" y="130">VIN</text><text x="638" y="154">3V3</text><text x="638" y="178">GND</text><text x="638" y="202">CS</text><text x="638" y="226">INT1</text><text x="638" y="250">INT2</text><text x="638" y="274">SDO</text><text x="638" y="298">SDA</text><text x="638" y="322">SCL</text></g>
  <!-- the chip, and its axes as printed (turned with the board) -->
  <rect x="700" y="176" width="40" height="64" rx="2" fill="#2b2b2b" stroke="#111"/>
  <text x="720" y="212" text-anchor="middle" font-size="9" fill="#bbb" font-family="Menlo, Consolas, monospace" transform="rotate(90 720 208)">345B</text>
  <g stroke="#fff" stroke-width="2" fill="#fff" font-size="12" font-family="Helvetica, Arial, sans-serif">
    <line x1="720" y1="262" x2="720" y2="296"/><path d="M714 290 L720 300 L726 290 z"/><text x="712" y="312" stroke="none" text-anchor="end">X</text>
    <line x1="720" y1="262" x2="754" y2="262"/><path d="M748 256 L758 262 L748 268 z"/><text x="760" y="276" stroke="none">Y</text>
    <circle cx="720" cy="262" r="6" fill="none"/><circle cx="720" cy="262" r="2"/><text x="708" y="258" stroke="none" text-anchor="end">Z</text>
  </g>
  <text x="710" y="368" text-anchor="middle" font-size="12" fill="#555">ADXL345 breakout (axes as printed on it)</text>
  <!-- wires, dupont ends on both pins: VCC to VIN, GND to GND, SCL to SCL, SDA to SDA -->
  <g stroke-linecap="round" fill="none">
    <path d="M495 270 C 545 270, 525 126, 575 126" stroke="#8e1c1c" stroke-width="7"/><path d="M495 270 C 545 270, 525 126, 575 126" stroke="#d32f2f" stroke-width="5"/>
    <path d="M495 246 C 545 246, 525 174, 575 174" stroke="#000" stroke-width="7"/><path d="M495 246 C 545 246, 525 174, 575 174" stroke="#3a3a3a" stroke-width="5"/>
    <path d="M495 222 C 545 222, 525 318, 575 318" stroke="#a88600" stroke-width="7"/><path d="M495 222 C 545 222, 525 318, 575 318" stroke="#f2c200" stroke-width="5"/>
    <path d="M495 198 C 545 198, 525 294, 575 294" stroke="#0d4f8c" stroke-width="7"/><path d="M495 198 C 545 198, 525 294, 575 294" stroke="#1e88e5" stroke-width="5"/>
  </g>
  <use href="#dupont" x="475" y="270"/><use href="#dupont" x="475" y="246"/><use href="#dupont" x="475" y="222"/><use href="#dupont" x="475" y="198"/>
  <use href="#dupont" x="575" y="126"/><use href="#dupont" x="575" y="174"/><use href="#dupont" x="575" y="318"/><use href="#dupont" x="575" y="294"/>
  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="20" y="408">Yellow jumper on I2C, green on 3V3, both before plugging in USB. Four wires: VCC (3.3 V) to VIN, GND to GND, SCL to SCL,</text>
    <text x="20" y="428">SDA to SDA. 3V3, CS, INT1, INT2 and SDO stay free: on r8845 the board answered as I2C at 0x53 so.</text>
  </g>
</svg>

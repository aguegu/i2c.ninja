<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 893 400" width="893" height="400" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A CH341T dongle in I2C mode at 3.3V wired to a MAX30102 module: GND, SCL, SDA, and VCC to VIN</title>

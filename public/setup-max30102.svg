  <use href="#dupont" x="475" y="198"/><use href="#dupont" x="475" y="222"/><use href="#dupont" x="475" y="246"/><use href="#dupont" x="475" y="270"/>
  <use href="#dupont" x="575" y="198"/><use href="#dupont" x="575" y="222"/><use href="#dupont" x="575" y="246"/><use href="#dupont" x="575" y="270"/>

  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="20" y="350">Yellow jumper on I2C, green on 3V3, both before plugging in USB. Four wires from its GND SCL SDA VIN row: GND to GND,</text>
    <text x="20" y="370">SCL to SCL, SDA to SDA (SDA and GND cross), VCC (3.3 V) to VIN (it takes 3.3-5 V). INT, IRD, RD, the other GND stay free.</text>
  </g>
  </g>
</svg>

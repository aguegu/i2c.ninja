  <text x="697" y="326" text-anchor="middle" font-size="12" fill="#555">MAX30102 module</text>

  <!-- wires, dupont ends on both pins: SDA and GND cross, SCL and VCC straight -->
  <g stroke-linecap="round" fill="none">
    <path d="M495 198 C 535 198, 535 246, 575 246" stroke="#0d4f8c" stroke-width="7"/><path d="M495 198 C 535 198, 535 246, 575 246" stroke="#1e88e5" stroke-width="5"/>
    <path d="M495 222 H 575" stroke="#a88600" stroke-width="7"/><path d="M495 222 H 575" stroke="#f2c200" stroke-width="5"/>

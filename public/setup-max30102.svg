  <g transform="translate(33 0)">
  <!-- the MAX30102 module (the common black board: pads 1-4 GND SCL SDA VIN on one edge, 5-8 INT IRD RD GND on the other), turned so 1-4 face the dongle -->
  <rect x="612" y="160" width="170" height="148" rx="10" fill="#1b1b1b" stroke="#000" stroke-width="2"/>
  <g fill="#d9b44a" stroke="#a88600">
    <rect x="616" y="191" width="18" height="14" rx="2"/><rect x="616" y="215" width="18" height="14" rx="2"/><rect x="616" y="239" width="18" height="14" rx="2"/><rect x="616" y="263" width="18" height="14" rx="2"/>
    <rect x="760" y="191" width="18" height="14" rx="2"/><rect x="760" y="215" width="18" height="14" rx="2"/><rect x="760" y="239" width="18" height="14" rx="2"/><rect x="760" y="263" width="18" height="14" rx="2"/>
  </g>

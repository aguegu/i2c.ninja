  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="20" y="414">Yellow jumper on I2C, green on 3V3, both before plugging in USB. Four wires: VCC (3.3 V) to VIN, GND to GND,</text>
    <text x="20" y="434">SCL to SCL, SDA to SDA (three cross). GPIO1 and XSHUT stay free. Point the sensor's window at what to measure.</text>
  </g>
  </g>

  <g font-size="12" fill="#333">
    <text x="20" y="570">Switch S1 on, S2 off (mode 1) before plugging in USB. Four wires: SDA, SCL, GND, and 3V3 to VCC (3.3V).</text>
    <text x="20" y="590">The 5V pins are USB's own 5 V. AD0, INT, XDA, XCL stay free: AD0 low on the GY-521 makes the address 0x68.</text>
  </g>

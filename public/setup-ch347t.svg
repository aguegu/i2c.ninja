  <rect x="318" y="185.0" width="30" height="16" rx="3" fill="url(#metal)" stroke="#8a9096"/>
  <text x="333" y="196.0" text-anchor="middle" font-size="7.5" fill="#555">8 MHz</text>
  <rect x="308.0" y="486" width="44" height="16" rx="7" fill="url(#metal)" stroke="#8a9096"/>
  <rect x="321.0" y="502" width="18" height="16" rx="3" fill="#2b2b2b"/>

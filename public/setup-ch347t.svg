  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A CH347T board (LXC-CH347) in mode 1 wired to a GY-521 (MPU-6050): SDA, SCL, GND, and 3V3 to VCC</title>

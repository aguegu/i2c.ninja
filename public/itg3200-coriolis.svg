<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A vibratory gyro: a mass driven back and forth; not turning it stays on its line; turning, the Coriolis effect pushes it sideways, one way then the other with each swing, by an amount that grows with the turning rate, picked up by capacitor plates</title>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#757575" stroke-width="2"/></pattern>
  </defs>
  <rect class="bg" width="760" height="330" fill="#fff"/>
  <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#212121">Not turning</text>
  <rect x="40" y="80" width="300" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="49" y="150" width="18" height="40" fill="url(#hatch)" stroke="#616161"/>
  <polyline points="67.0,170.0 78.1,175.0 89.2,165.0 100.4,175.0 111.5,165.0 122.6,175.0 133.8,165.0 144.9,175.0 156.0,170.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <rect x="313" y="150" width="18" height="40" fill="url(#hatch)" stroke="#616161"/>
  <polyline points="313.0,170.0 301.9,165.0 290.8,175.0 279.6,165.0 268.5,175.0 257.4,165.0 246.2,175.0 235.1,165.0 224.0,170.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <rect x="144" y="103" width="92" height="10" fill="#9e9e9e" stroke="#616161"/>
  <rect x="144" y="227" width="92" height="10" fill="#9e9e9e" stroke="#616161"/>
  <text x="244" y="112" font-size="10" fill="#616161">sense plates</text>
  <text x="244" y="236" font-size="10" fill="#616161">(capacitors)</text>
  <rect x="156" y="148" width="68" height="44" rx="5" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <text x="190" y="174" text-anchor="middle" font-size="11" fill="#fff">mass</text>
  <line x1="130" y1="200" x2="250" y2="200" stroke="#2563eb" stroke-width="3" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="190" y="216" text-anchor="middle" font-size="10" fill="#1d4ed8">driven back and forth</text>
  <text x="190" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#212121">it stays on its line</text>
  <text x="190" y="316" text-anchor="middle" font-size="11" fill="#424242">the plates see equal gaps: reads 0</text>
  <text x="570" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#212121">Turning</text>
  <rect x="420" y="80" width="300" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="429" y="150" width="18" height="40" fill="url(#hatch)" stroke="#616161"/>
  <polyline points="447.0,170.0 458.9,173.2 468.5,161.6 481.2,169.7 490.7,158.1 503.4,166.2 513.0,154.6 525.7,162.7 536.0,156.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <rect x="693" y="150" width="18" height="40" fill="url(#hatch)" stroke="#616161"/>
  <polyline points="693.0,170.0 682.7,163.3 670.0,171.4 660.4,159.8 647.7,167.9 638.2,156.3 625.5,164.4 615.9,152.8 604.0,156.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <rect x="524" y="103" width="92" height="10" fill="#9e9e9e" stroke="#616161"/>
  <rect x="524" y="227" width="92" height="10" fill="#9e9e9e" stroke="#616161"/>
  <text x="624" y="112" font-size="10" fill="#616161">sense plates</text>
  <text x="624" y="236" font-size="10" fill="#616161">(capacitors)</text>
  <rect x="536" y="148" width="68" height="44" rx="5" fill="none" stroke="#1f5fa8" stroke-dasharray="4 3"/>
  <rect x="536" y="134" width="68" height="44" rx="5" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <text x="570" y="160" text-anchor="middle" font-size="11" fill="#fff">mass</text>
  <line x1="510" y1="200" x2="630" y2="200" stroke="#2563eb" stroke-width="3" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="570" y="216" text-anchor="middle" font-size="10" fill="#1d4ed8">driven back and forth</text>
  <path d="M 698 66 A 16 16 0 1 1 682 50" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#w)"/>
  <text x="666" y="64" text-anchor="end" font-size="12" font-weight="bold" fill="#059669">the turn, Ω</text>
  <line x1="570" y1="132" x2="570" y2="112" stroke="#e11d48" stroke-width="3" marker-end="url(#c)"/>
  <text x="562" y="126" text-anchor="end" font-size="11" font-weight="bold" fill="#e11d48">Coriolis</text>
  <text x="570" y="252" text-anchor="middle" font-size="10" fill="#1d4ed8">(this instant: moving right)</text>
  <text x="570" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#212121">pushed sideways: F = 2 m v × Ω</text>
  <text x="570" y="316" text-anchor="middle" font-size="11" fill="#424242">with each swing it flips; the plates feel it, in step with the drive</text>
  <line x1="380" y1="20" x2="380" y2="280" stroke="#e0e0e0" stroke-width="2"/>
</svg>

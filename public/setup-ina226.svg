  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A CH341T 2-in-1 dongle, yellow jumper on I2C and green on 3V3, wired to a blue INA226 module seen from its front: SDA to SDA, SCL to SCL, GND to GND, VCC to VCC, four straight wires; IN+ led to the supply plus and IN minus to the load plus, VBS tied to IN minus on the module, ALE free</title>

  <g font-size="12" fill="#333">
    <text x="20" y="505">Yellow jumper on I2C, green on 3V3, both before plugging in USB. Four straight wires: SDA, SCL, GND, VCC.</text>
    <text x="20" y="525">IN+ from the supply's +, IN- to the load's +, VBS to IN-; the supply's - to GND. ALE free. Up to 36 V, about 0.82 A.</text>
  </g>

  <text x="690.1" y="382.0" text-anchor="middle" font-size="12" fill="#555">CJMCU-900F, from its pins (chip dashed, other side)</text>
  <g font-size="12" fill="#333">
    <text x="20" y="460">Yellow jumper on I2C, green on 3V3 (the BMX055 takes 3.6V at most), both before plugging in USB.</text>
    <text x="20" y="480">Four wires: VCC to 3.3V, GND, SCL, SDA. On the module, tie PS (high for I2C) and SDO1, SDO2, CSB3 (the addresses)</text>
    <text x="20" y="500">to 3.3V, one wire from pin 1: 0x19, 0x69, 0x13. Left floating, the addresses drift. CSB1 and CSB2 stay free.</text>
  </g>

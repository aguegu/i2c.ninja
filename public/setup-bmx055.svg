  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A CH341T 2-in-1 dongle, yellow jumper on I2C and green on 3V3, wired to a BMX055 module (CJMCU-900F) seen from its pins: VCC to 3.3V, GND to GND, SCL to SCL, SDA to SDA; on the module one wire ties 3.3V to PS, SDO1, SDO2 and CSB3</title>

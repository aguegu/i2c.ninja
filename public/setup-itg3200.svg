  <g transform="translate(33 0)">
  <!-- the ITG-3200 module (blue: pins VDD VIO GND INT CLK SDA SCL along one edge, an AD0 jumper, no mounting holes), turned a quarter anticlockwise so its pins face the dongle: its X arrow now points right, Y up, Z out of the board -->
  <rect x="612" y="104" width="172" height="190" rx="6" fill="#1f4fa8" stroke="#163f70" stroke-width="2"/>
  <g fill="#e0e0e0" stroke="#9e9e9e"><circle cx="624" cy="126" r="7"/><circle cx="624" cy="150" r="7"/><circle cx="624" cy="174" r="7"/><circle cx="624" cy="198" r="7"/><circle cx="624" cy="222" r="7"/><circle cx="624" cy="246" r="7"/><circle cx="624" cy="270" r="7"/></g>
  <g fill="url(#pin)"><rect x="593" y="124" width="34" height="4"/><rect x="593" y="148" width="34" height="4"/><rect x="593" y="172" width="34" height="4"/><rect x="593" y="196" width="34" height="4"/><rect x="593" y="220" width="34" height="4"/><rect x="593" y="244" width="34" height="4"/><rect x="593" y="268" width="34" height="4"/></g>

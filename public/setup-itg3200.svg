  <!-- the chip, the AD0 jumper, the module's name, and its axes as printed (turned with it) -->
  <rect x="694" y="160" width="40" height="40" rx="3" fill="#2b2b2b" stroke="#111"/>
  <rect x="700" y="124" width="34" height="18" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><text x="717" y="118" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">AD0</text>
  <text x="772" y="200" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace" transform="rotate(90 772 200)">ITG-3200 Module</text>
  <g stroke="#fff" stroke-width="2" fill="#fff" font-size="12" font-family="Helvetica, Arial, sans-serif">

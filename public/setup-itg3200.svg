<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A CH341T dongle in I2C mode at 3.3V wired to an ITG-3200 breakout: VCC to VCC, GND to GND, SCL to SCL, SDA to SDA, a short jumper from VIO to VCC; INT and CLK free</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ecef"/>
      <stop offset="0.5" stop-color="#b8bec5"/>
      <stop offset="1" stop-color="#d9dde1"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d77a"/>
      <stop offset="1" stop-color="#b8922a"/>
    </linearGradient>
    <g id="dupont">
      <rect x="0" y="-6" width="20" height="12" rx="1.5" fill="#1b1b1b"/>
      <rect x="2" y="-2" width="4" height="4" fill="#444"/>
    </g>
  </defs>

  <rect class="bg" width="860" height="400" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">CH341T (I2C mode, 3.3V) + ITG-3200 breakout</text>

  <!-- USB-A plug -->
  <text x="70" y="160" text-anchor="middle" font-size="12" fill="#555">to the PC</text>
  <rect x="20" y="170" width="100" height="90" rx="3" fill="url(#metal)" stroke="#8a9096"/>
  <rect x="38" y="190" width="16" height="12" fill="#6b7178"/>
  <rect x="38" y="228" width="16" height="12" fill="#6b7178"/>

  <!-- the dongle's PCB -->
  <rect x="118" y="125" width="340" height="180" rx="8" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <text x="130" y="318" font-size="12" fill="#555">CH341T 2-in-1 module (USB to I2C / TTL)</text>

  <!-- LEDs -->
  <rect x="134" y="140" width="10" height="7" fill="#f1f1f1" stroke="#999"/>
  <text x="150" y="147" font-size="9" fill="#fff">RDY</text>
  <rect x="134" y="282" width="10" height="7" fill="#f1f1f1" stroke="#999"/>
  <text x="150" y="289" font-size="9" fill="#fff">TNOW</text>

  <!-- crystal, chip -->
  <rect x="160" y="196" width="72" height="30" rx="14" fill="url(#metal)" stroke="#8a9096"/>
  <text x="196" y="215" text-anchor="middle" font-size="8" fill="#555">12.000</text>
  <g fill="#c9ccd1">
    <rect x="252" y="176" width="3" height="8"/><rect x="259" y="176" width="3" height="8"/><rect x="266" y="176" width="3" height="8"/><rect x="273" y="176" width="3" height="8"/><rect x="280" y="176" width="3" height="8"/>
    <rect x="287" y="176" width="3" height="8"/><rect x="294" y="176" width="3" height="8"/><rect x="301" y="176" width="3" height="8"/><rect x="308" y="176" width="3" height="8"/><rect x="315" y="176" width="3" height="8"/>
    <rect x="252" y="236" width="3" height="8"/><rect x="259" y="236" width="3" height="8"/><rect x="266" y="236" width="3" height="8"/><rect x="273" y="236" width="3" height="8"/><rect x="280" y="236" width="3" height="8"/>
    <rect x="287" y="236" width="3" height="8"/><rect x="294" y="236" width="3" height="8"/><rect x="301" y="236" width="3" height="8"/><rect x="308" y="236" width="3" height="8"/><rect x="315" y="236" width="3" height="8"/>
  </g>
  <rect x="248" y="183" width="74" height="54" rx="2" fill="#1d1d1d"/>
  <text x="285" y="214" text-anchor="middle" font-size="10" fill="#ccc">CH341T</text>

  <!-- mode jumper (yellow): TTL | I2C, the cap on I2C -->
  <text x="340" y="141" text-anchor="middle" font-size="9" fill="#fff">TTL</text>
  <text x="380" y="141" text-anchor="middle" font-size="9" fill="#fff">I2C</text>
  <g fill="#111"><rect x="333" y="147" width="14" height="14"/><rect x="353" y="147" width="14" height="14"/><rect x="373" y="147" width="14" height="14"/></g>
  <circle cx="340" cy="154" r="3" fill="url(#pin)"/>
  <rect x="351" y="144" width="38" height="20" rx="3" fill="#f2c200" stroke="#a88600"/>
  <rect x="361" y="150" width="18" height="8" rx="2" fill="#d8ac00"/>

  <!-- voltage jumper (green): 3V3 | 5V, the cap on 3V3 -->
  <g fill="#111"><rect x="333" y="262" width="14" height="14"/><rect x="353" y="262" width="14" height="14"/><rect x="373" y="262" width="14" height="14"/></g>
  <circle cx="380" cy="269" r="3" fill="url(#pin)"/>
  <rect x="331" y="259" width="38" height="20" rx="3" fill="#2fa36b" stroke="#1d6e47"/>
  <rect x="341" y="265" width="18" height="8" rx="2" fill="#268a5a"/>
  <text x="340" y="293" text-anchor="middle" font-size="9" fill="#fff">3V3</text>
  <text x="380" y="293" text-anchor="middle" font-size="9" fill="#fff">5V</text>

  <!-- the dongle's header: top to bottom RXD TXD SDA SCL GND VCC -->
  <rect x="432" y="138" width="22" height="144" fill="#161616"/>
  <g font-size="11" fill="#fff" text-anchor="end" font-family="Menlo, Consolas, monospace">
    <text x="426" y="154">RXD</text><text x="426" y="178">TXD</text><text x="426" y="202">SDA</text>
    <text x="426" y="226">SCL</text><text x="426" y="250">GND</text><text x="426" y="274">VCC</text>
  </g>
  <g fill="url(#pin)">
    <rect x="443" y="148" width="34" height="4"/><rect x="443" y="172" width="34" height="4"/><rect x="443" y="196" width="34" height="4"/>
    <rect x="443" y="220" width="34" height="4"/><rect x="443" y="244" width="34" height="4"/><rect x="443" y="268" width="34" height="4"/>
  </g>


  <!-- the ITG-3200 breakout (red: pins VCC VIO GND INT CLK SDA SCL down one edge, two mounting holes on the other, an AD0 jumper), turned half a turn so its pins face the dongle: its X arrow now points right, Y up, Z out of the board -->
  <rect x="612" y="96" width="190" height="200" rx="8" fill="#d32f2f" stroke="#8e1c1c" stroke-width="2"/>
  <circle cx="776" cy="122" r="13" fill="#fff" stroke="#e0e0e0" stroke-width="3"/>
  <circle cx="776" cy="270" r="13" fill="#fff" stroke="#e0e0e0" stroke-width="3"/>
  <g fill="#e0e0e0" stroke="#9e9e9e"><circle cx="624" cy="126" r="7"/><circle cx="624" cy="150" r="7"/><circle cx="624" cy="174" r="7"/><circle cx="624" cy="198" r="7"/><circle cx="624" cy="222" r="7"/><circle cx="624" cy="246" r="7"/><circle cx="624" cy="270" r="7"/></g>
  <g fill="url(#pin)"><rect x="593" y="124" width="34" height="4"/><rect x="593" y="148" width="34" height="4"/><rect x="593" y="172" width="34" height="4"/><rect x="593" y="196" width="34" height="4"/><rect x="593" y="220" width="34" height="4"/><rect x="593" y="244" width="34" height="4"/><rect x="593" y="268" width="34" height="4"/></g>
  <g font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace"><text x="638" y="130">SCL</text><text x="638" y="154">SDA</text><text x="638" y="178">CLK</text><text x="638" y="202">INT</text><text x="638" y="226">GND</text><text x="638" y="250">VIO</text><text x="638" y="274">VCC</text></g>
  <!-- the chip, the AD0 jumper, and its axes as printed (turned with the board) -->
  <rect x="690" y="160" width="40" height="40" rx="2" fill="#2b2b2b" stroke="#111" transform="rotate(45 710 180)"/>
  <rect x="684" y="110" width="34" height="18" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><text x="701" y="140" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">AD0</text>
  <g stroke="#fff" stroke-width="2" fill="#fff" font-size="12" font-family="Helvetica, Arial, sans-serif">
    <line x1="716" y1="252" x2="750" y2="252"/><path d="M744 246 L754 252 L744 258 z"/><text x="758" y="256" stroke="none">X</text>
    <line x1="716" y1="252" x2="716" y2="230"/><path d="M710 236 L716 226 L722 236 z"/><text x="703" y="236" stroke="none" text-anchor="end">Y</text>
    <circle cx="716" cy="252" r="6" fill="none"/><circle cx="716" cy="252" r="2"/><text x="709" y="272" stroke="none" text-anchor="end">Z</text>
  </g>
  <text x="707" y="316" text-anchor="middle" font-size="12" fill="#555">ITG-3200 breakout (axes as printed on it)</text>
  <!-- wires, dupont ends on both pins: VCC to VCC, GND to GND, SCL to SCL, SDA to SDA -->
  <g stroke-linecap="round" fill="none">
    <path d="M495 270 C 545 270, 525 270, 575 270" stroke="#8e1c1c" stroke-width="7"/><path d="M495 270 C 545 270, 525 270, 575 270" stroke="#d32f2f" stroke-width="5"/>
    <path d="M495 246 C 545 246, 525 222, 575 222" stroke="#000" stroke-width="7"/><path d="M495 246 C 545 246, 525 222, 575 222" stroke="#3a3a3a" stroke-width="5"/>
    <path d="M495 222 C 545 222, 525 126, 575 126" stroke="#a88600" stroke-width="7"/><path d="M495 222 C 545 222, 525 126, 575 126" stroke="#f2c200" stroke-width="5"/>
    <path d="M495 198 C 545 198, 525 150, 575 150" stroke="#0d4f8c" stroke-width="7"/><path d="M495 198 C 545 198, 525 150, 575 150" stroke="#1e88e5" stroke-width="5"/>
  </g>
  <use href="#dupont" x="475" y="270"/><use href="#dupont" x="475" y="246"/><use href="#dupont" x="475" y="222"/><use href="#dupont" x="475" y="198"/>
  <use href="#dupont" x="575" y="270"/><use href="#dupont" x="575" y="222"/><use href="#dupont" x="575" y="126"/><use href="#dupont" x="575" y="150"/>
  <path d="M606 246 C 586 248, 586 256, 597 264" fill="none" stroke="#e65100" stroke-width="4" stroke-linecap="round"/>
  <text x="588" y="296" text-anchor="middle" font-size="10" fill="#e65100">VIO to VCC</text>
  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="20" y="352">Yellow jumper on I2C, green on 3V3, both before plugging in USB. Four wires: VCC (3.3 V) to VCC, GND to GND, SCL to SCL, SDA to SDA;</text>
    <text x="20" y="372">and VIO (its I/O voltage) to VCC, unless the board ties them already. INT and CLK stay free; AD0 as shipped (0x68 on r8845).</text>
  </g>
</svg>

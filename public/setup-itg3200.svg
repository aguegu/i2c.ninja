  </g>
  <text x="698" y="316" text-anchor="middle" font-size="12" fill="#555">ITG-3200 module (axes as printed on it)</text>
  <!-- wires, dupont ends on both pins: VCC to VDD, GND to GND, SCL to SCL, SDA to SDA -->
  <g stroke-linecap="round" fill="none">
    <path d="M495 270 C 545 270, 525 270, 575 270" stroke="#8e1c1c" stroke-width="7"/><path d="M495 270 C 545 270, 525 270, 575 270" stroke="#d32f2f" stroke-width="5"/>
    <path d="M495 246 C 545 246, 525 222, 575 222" stroke="#000" stroke-width="7"/><path d="M495 246 C 545 246, 525 222, 575 222" stroke="#3a3a3a" stroke-width="5"/>
    <path d="M495 222 C 545 222, 525 126, 575 126" stroke="#a88600" stroke-width="7"/><path d="M495 222 C 545 222, 525 126, 575 126" stroke="#f2c200" stroke-width="5"/>
    <path d="M495 198 C 545 198, 525 150, 575 150" stroke="#0d4f8c" stroke-width="7"/><path d="M495 198 C 545 198, 525 150, 575 150" stroke="#1e88e5" stroke-width="5"/>
  </g>
  <use href="#dupont" x="475" y="270"/><use href="#dupont" x="475" y="246"/><use href="#dupont" x="475" y="222"/><use href="#dupont" x="475" y="198"/>
  <use href="#dupont" x="575" y="270"/><use href="#dupont" x="575" y="222"/><use href="#dupont" x="575" y="126"/><use href="#dupont" x="575" y="150"/>
  <path d="M606 246 C 586 248, 586 256, 597 264" fill="none" stroke="#e65100" stroke-width="4" stroke-linecap="round"/>
  <text x="588" y="296" text-anchor="middle" font-size="10" fill="#e65100">VIO to VDD</text>
  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="20" y="352">Yellow jumper on I2C, green on 3V3, both before plugging in USB. Four wires: VCC (3.3 V) to VDD, GND to GND, SCL to SCL, SDA to SDA;</text>
    <text x="20" y="372">and VIO (its I/O voltage) to VDD, unless the board ties them already. INT and CLK stay free; AD0 as shipped: 0x68 on the board tried.</text>
  </g>
  </g>

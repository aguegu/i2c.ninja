  <text x="381.8661417322835" y="267.0314960629921" text-anchor="middle" font-size="9" fill="#fff">5V</text><text x="333.8661417322835" y="267.0314960629921" text-anchor="middle" font-size="9" fill="#fff">3V3</text>

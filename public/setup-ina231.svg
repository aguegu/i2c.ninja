  <text x="243.66141732283467" y="275.8267716535433" font-size="9" fill="#fff">RDY</text>

  <g transform="translate(33 0)">
  <!-- the INA231 module (the common blue board: pins ALE SDA SCL Gnd Vdd Gnd Bus, IN+ and IN- holes, R100), turned so its header faces the dongle -->
  <rect x="612" y="150" width="190" height="186" rx="6" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <rect x="616" y="164" width="22" height="168" fill="#161616"/>
  <g fill="url(#pin)">
    <rect x="593" y="172" width="34" height="4"/><rect x="593" y="196" width="34" height="4"/><rect x="593" y="220" width="34" height="4"/>
    <rect x="593" y="244" width="34" height="4"/><rect x="593" y="268" width="34" height="4"/><rect x="593" y="292" width="34" height="4"/>
    <rect x="593" y="316" width="34" height="4"/>
  </g>
  <g font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">
    <text x="644" y="178">ALE</text><text x="644" y="202">SDA</text><text x="644" y="226">SCL</text><text x="644" y="250">Gnd</text>
    <text x="644" y="274">Vdd</text><text x="644" y="298">Gnd</text><text x="644" y="322">Bus</text>
  </g>
  <!-- the shunt between IN+ (top) and IN- (bottom) -->
  <circle cx="770" cy="186" r="14" fill="#fff" stroke="#c9ccd1" stroke-width="5"/>
  <circle cx="770" cy="300" r="14" fill="#fff" stroke="#c9ccd1" stroke-width="5"/>
  <text x="744" y="190" text-anchor="end" font-size="11" fill="#fff" font-weight="bold">IN+</text>
  <text x="744" y="304" text-anchor="end" font-size="11" fill="#fff" font-weight="bold">IN−</text>
  <rect x="752" y="214" width="36" height="58" rx="3" fill="#2b2b2b" stroke="#888"/>
  <text x="770" y="247" text-anchor="middle" font-size="10" fill="#ddd" transform="rotate(-90 770 243)">R100</text>
  <rect x="690" y="232" width="16" height="16" fill="#1d1d1d"/>
  <text x="698" y="262" text-anchor="middle" font-size="9" fill="#fff">INA231</text>
  <text x="707" y="352" text-anchor="middle" font-size="12" fill="#555">INA231 module (shunt R100: 0.1 Ω)</text>

  <!-- the circuit measured: a supply, the shunt, a load -->
  <rect x="890" y="96" width="150" height="70" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="965" y="126" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">supply</text>
  <text x="965" y="146" text-anchor="middle" font-size="11" fill="#555">e.g. 5 V</text>
  <text x="914" y="92" font-size="15" fill="#c62828" font-weight="bold">+</text>
  <text x="1034" y="92" font-size="15" fill="#333" font-weight="bold">−</text>
  <rect x="890" y="326" width="150" height="70" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="965" y="356" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">load</text>
  <text x="965" y="376" text-anchor="middle" font-size="11" fill="#555">what draws the current</text>
  <text x="914" y="416" font-size="15" fill="#c62828" font-weight="bold">+</text>
  <text x="1034" y="416" font-size="15" fill="#333" font-weight="bold">−</text>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- supply + to IN+ -->
    <path d="M905 96 V 70 H 840 V 186 H 784" stroke="#8e1c1c" stroke-width="6"/><path d="M905 96 V 70 H 840 V 186 H 784" stroke="#d32f2f" stroke-width="4"/>
    <!-- IN- to load + -->
    <path d="M784 300 H 840 V 430 H 905 V 396" stroke="#8e1c1c" stroke-width="6"/><path d="M784 300 H 840 V 430 H 905 V 396" stroke="#d32f2f" stroke-width="4"/>
    <!-- load - to supply - -->
    <path d="M1025 326 V 166" stroke="#000" stroke-width="6"/><path d="M1025 326 V 166" stroke="#3a3a3a" stroke-width="4"/>
    <!-- supply - to the common ground (the module's other Gnd) -->
    <path d="M1025 246 H 1060 V 452 H 560 V 294 H 593" stroke="#000" stroke-width="6"/><path d="M1025 246 H 1060 V 452 H 560 V 294 H 593" stroke="#3a3a3a" stroke-width="4"/>
    <!-- Bus to IN- (the load's side): the voltage the load sees -->
    <path d="M593 318 H 575 V 440 H 820 V 300" stroke="#4a1f6b" stroke-width="6"/><path d="M593 318 H 575 V 440 H 820 V 300" stroke="#8e44ad" stroke-width="4"/>
  </g>
  <circle cx="820" cy="300" r="4" fill="#4a1f6b"/><circle cx="1025" cy="246" r="4" fill="#000"/>

  <!-- the I2C wires, dupont ends on both pins -->
  <g stroke-linecap="round" fill="none">
    <path d="M495 198 H 575" stroke="#0d4f8c" stroke-width="7"/><path d="M495 198 H 575" stroke="#1e88e5" stroke-width="5"/>
    <path d="M495 222 H 575" stroke="#a88600" stroke-width="7"/><path d="M495 222 H 575" stroke="#f2c200" stroke-width="5"/>
    <path d="M495 246 H 575" stroke="#000" stroke-width="7"/><path d="M495 246 H 575" stroke="#3a3a3a" stroke-width="5"/>
    <path d="M495 270 H 575" stroke="#8e1c1c" stroke-width="7"/><path d="M495 270 H 575" stroke="#d32f2f" stroke-width="5"/>
  </g>
  <use href="#dupont" x="475" y="198"/><use href="#dupont" x="475" y="222"/><use href="#dupont" x="475" y="246"/><use href="#dupont" x="475" y="270"/>
  <use href="#dupont" x="575" y="198"/><use href="#dupont" x="575" y="222"/><use href="#dupont" x="575" y="246"/><use href="#dupont" x="575" y="270"/>
  <use href="#dupont" x="575" y="294"/><use href="#dupont" x="575" y="318"/>

  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="20" y="488">Jumpers as for any I2C device: yellow on I2C, green on 3V3. Four wires as usual: SDA, SCL, GND, Vdd to VCC (3.3 V).</text>
    <text x="20" y="508">The current to measure runs through the shunt: supply + to IN+, IN− to the load. Bus to IN− reads the load’s voltage;</text>
    <text x="20" y="528">the supply’s − joined to Gnd gives that voltage its reference. ALE (alert) stays free; A0, A1 open: address 0x40.</text>
  </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1113 540" width="1113" height="540" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A CH341T dongle in I2C mode at 3.3V wired to an INA231 module, its shunt in series between a supply and a load</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ecef"/>
      <stop offset="0.5" stop-color="#b8bec5"/>
      <stop offset="1" stop-color="#d9dde1"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d77a"/>
      <stop offset="1" stop-color="#b8922a"/>
    </linearGradient>
    <g id="dupont">
      <rect x="0" y="-6" width="20" height="12" rx="1.5" fill="#1b1b1b"/>
      <rect x="2" y="-2" width="4" height="4" fill="#444"/>
    </g>
  </defs>

  <rect class="bg" width="1113" height="540" fill="#ffffff"/>
  <text x="556" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">CH341T (I2C mode, 3.3V) + INA231 module: a load’s current through its shunt</text>


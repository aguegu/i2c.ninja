  <g font-size="12" fill="#333">
    <text x="20" y="779">JP1 on its bottom pair (3V3 to VIO): the I2C at 3.3 V. Four wires from P5: SDA, SCL, GND, and the pin printed 3V3 (VIO) to VCC.</text>
    <text x="20" y="799">No modes to set: the site switches the CH347F's I2C on when it opens it. The board's own EEPROM answers at 0x50.</text>
    <text x="20" y="819">AD0, INT, XDA, XCL stay free: AD0 low on the GY-521 makes the address 0x68.</text>
  </g>
</svg>

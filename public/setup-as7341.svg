  <title>A CH341T 2-in-1 dongle, yellow jumper on I2C and green on 3V3, wired to a black AS7341 module (AS734x) seen from its back: SDA to SDA, SCL to SCL, GND to GND, VCC to VIN, four straight wires; its GPIO and INT pins free</title>

  <polyline points="50.0,145.0 57.8,146.6 60.1,153.2 66.1,142.2 67.2,154.7 73.2,143.7 74.3,156.1 80.2,145.1 81.3,157.6 87.3,146.6 88.4,159.1 94.3,148.0 95.4,160.5 100.2,155.4 108.0,157.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="210.0,145.0 202.2,146.6 197.4,141.5 196.3,154.0 190.4,142.9 189.3,155.4 183.3,144.4 182.2,156.9 176.3,145.9 175.2,158.3 169.2,147.3 168.1,159.8 162.1,148.8 159.8,155.4 152.0,157.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <rect x="108" y="123.0" width="44" height="44" rx="4" fill="none" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="108" y="135.0" width="44" height="44" rx="4" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <text x="130" y="161.0" text-anchor="middle" font-size="11" fill="#fff">mass</text>
  <line x1="232" y1="100" x2="232" y2="150" stroke="#455a64" stroke-width="2.5" marker-end="url(#grey)"/>
  <text x="238" y="128" font-size="11" fill="#455a64">g</text>
  <text x="130" y="296" text-anchor="middle" font-size="13" fill="#e11d48" font-weight="bold">reads 1 g, up</text>
  <text x="130" y="316" text-anchor="middle" font-size="11" fill="#424242">the springs hold it up against gravity</text>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#212121">Pushed to the right</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#616161">from above (gravity into the page)</text>
  <rect x="300" y="70" width="160" height="150" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="3"/>

  <polyline points="460.0,145.0 452.0,145.0 447.5,139.0 443.0,151.0 438.5,139.0 434.0,151.0 429.5,139.0 425.0,151.0 420.5,139.0 416.0,151.0 411.5,139.0 407.0,151.0 402.5,139.0 398.0,145.0 390.0,145.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <rect x="358" y="123.0" width="44" height="44" rx="4" fill="none" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="346" y="123.0" width="44" height="44" rx="4" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <text x="368" y="149.0" text-anchor="middle" font-size="11" fill="#fff">mass</text>
  <g transform="translate(484 92)" stroke="#455a64" stroke-width="2" fill="none"><circle r="8"/><line x1="-5" y1="-5" x2="5" y2="5"/><line x1="5" y1="-5" x2="-5" y2="5"/></g>
  <text x="484" y="116" text-anchor="middle" font-size="11" fill="#455a64">g</text>
  <line x1="330" y1="242" x2="430" y2="242" stroke="#455a64" stroke-width="5" marker-end="url(#grey)"/>
  <text x="380" y="262" text-anchor="middle" font-size="11" fill="#455a64">the chip pushed</text>
  <text x="380" y="296" text-anchor="middle" font-size="13" fill="#e11d48" font-weight="bold">reads the push, to the right</text>
  <text x="380" y="316" text-anchor="middle" font-size="11" fill="#424242">the mass lags; the springs pull it along</text>
  <text x="630" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#212121">Falling</text>
  <text x="630" y="48" text-anchor="middle" font-size="11" fill="#616161">from the side</text>
  <rect x="550" y="70" width="160" height="150" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A mass on springs: held still the springs hold it up against gravity and it reads 1 g up; pushed to the right it lags and the reading points right; falling, the springs relax and it reads 0 g</title>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
    <marker id="grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#455a64"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#757575" stroke-width="2"/></pattern>
  </defs>
  <rect class="bg" width="760" height="330" fill="#fff"/>
  <text x="130" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#212121">Held still</text>
  <text x="130" y="48" text-anchor="middle" font-size="11" fill="#616161">from the side</text>
  <rect x="50" y="70" width="160" height="150" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="3"/>

  <polyline points="630.0,220.0 630.0,212.1 636.0,209.0 624.0,205.9 636.0,202.8 624.0,199.7 636.0,196.6 624.0,193.5 636.0,190.4 624.0,187.3 636.0,184.2 624.0,181.1 636.0,178.0 630.0,174.9 630.0,167.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="550.0,145.0 558.0,145.0 561.5,151.0 565.0,139.0 568.5,151.0 572.0,139.0 575.5,151.0 579.0,139.0 582.5,151.0 586.0,139.0 589.5,151.0 593.0,139.0 596.5,151.0 600.0,145.0 608.0,145.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="710.0,145.0 702.0,145.0 698.5,139.0 695.0,151.0 691.5,139.0 688.0,151.0 684.5,139.0 681.0,151.0 677.5,139.0 674.0,151.0 670.5,139.0 667.0,151.0 663.5,139.0 660.0,145.0 652.0,145.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <rect x="608" y="123.0" width="44" height="44" rx="4" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <text x="630" y="149.0" text-anchor="middle" font-size="11" fill="#fff">mass</text>
  <line x1="732" y1="100" x2="732" y2="150" stroke="#455a64" stroke-width="2.5" marker-end="url(#grey)"/>
  <text x="738" y="128" font-size="11" fill="#455a64">g</text>
  <text x="630" y="296" text-anchor="middle" font-size="13" fill="#e11d48" font-weight="bold">reads 0 g</text>
  <text x="630" y="316" text-anchor="middle" font-size="11" fill="#424242">nothing to hold up: the springs relax</text>
  <line x1="253" y1="60" x2="253" y2="300" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="507" y1="60" x2="507" y2="300" stroke="#e0e0e0" stroke-width="2"/>
</svg>

  <use href="#dupont" x="475" y="198"/><use href="#dupont" x="475" y="222"/><use href="#dupont" x="475" y="246"/><use href="#dupont" x="475" y="270"/>
  <use href="#dupont" x="575" y="198"/><use href="#dupont" x="575" y="222"/><use href="#dupont" x="575" y="246"/><use href="#dupont" x="575" y="270"/>

  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="20" y="350">Yellow jumper on I2C, green on 3V3, both before plugging in USB. Its pads run VDD, SDA, GND, SCL: VCC (3.3 V) to 1,</text>
    <text x="20" y="370">SDA to 2, GND to 3, SCL to 4 (three wires cross). It takes 2.2-5.5 V. Keep it away from warm parts.</text>
  </g>
  </g>
</svg>

  <g transform="translate(33 0)">
  <!-- the AHT21B (Aosong's own green module, datasheet Figure 1 and Table 5: pads 1 VDD, 2 SDA, 3 GND, 4 SCL, top view), a header soldered into its half-hole pads, turned to face the dongle -->
  <rect x="612" y="168" width="150" height="128" rx="6" fill="#2e9e3e" stroke="#1d6e2a" stroke-width="2"/>
  <g fill="#d9b44a" stroke="#a88600"><circle cx="624" cy="198" r="8"/><circle cx="624" cy="222" r="8"/><circle cx="624" cy="246" r="8"/><circle cx="624" cy="270" r="8"/></g>

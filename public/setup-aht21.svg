  <text x="726" y="256" text-anchor="middle" font-size="8" fill="#e8f5e9">AHT21B</text>
  <text x="687" y="316" text-anchor="middle" font-size="12" fill="#555">AHT21B module</text>

  <!-- wires, dupont ends on both pins: VCC to pin 1, SDA to pin 2, GND to pin 3, SCL to pin 4 -->
  <g stroke-linecap="round" fill="none">
    <path d="M495 198 C 535 198, 535 222, 575 222" stroke="#0d4f8c" stroke-width="7"/><path d="M495 198 C 535 198, 535 222, 575 222" stroke="#1e88e5" stroke-width="5"/>
    <path d="M495 222 C 540 222, 530 270, 575 270" stroke="#a88600" stroke-width="7"/><path d="M495 222 C 540 222, 530 270, 575 270" stroke="#f2c200" stroke-width="5"/>
    <path d="M495 246 H 575" stroke="#000" stroke-width="7"/><path d="M495 246 H 575" stroke="#3a3a3a" stroke-width="5"/>
    <path d="M495 270 C 545 270, 525 198, 575 198" stroke="#8e1c1c" stroke-width="7"/><path d="M495 270 C 545 270, 525 198, 575 198" stroke="#d32f2f" stroke-width="5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="A datasheet's register table becomes one atiic driver, which runs over any adapter: a USB dongle, a microcontroller, the next one">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
  <rect class="bg" width="760" height="320" rx="14" fill="#f8fafc"/>
  <g transform="translate(40 46)">
    <path d="M0 0h130l26 26v190H0z" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M130 0v26h26" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="78" y="28" font-size="11" fill="#64748b" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >DATASHEET</text>
    <rect x="12" y="42" width="132" height="20" fill="#f1f5f9"/>
    <text x="18" y="56" font-size="11" fill="#059669" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" >0x75</text>
    <text x="56" y="56" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" >WHO_AM_I</text>
    <rect x="12" y="66" width="132" height="20" fill="#fff"/>
    <text x="18" y="80" font-size="11" fill="#059669" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" >0x6B</text>
    <text x="56" y="80" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" >PWR_MGMT_1</text>
    <rect x="12" y="90" width="132" height="20" fill="#f1f5f9"/>
    <text x="18" y="104" font-size="11" fill="#059669" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" >0x1C</text>
    <text x="56" y="104" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" >ACCEL_CONFIG</text>
    <rect x="12" y="114" width="132" height="20" fill="#fff"/>
    <text x="18" y="128" font-size="11" fill="#059669" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" >0x3B</text>
    <text x="56" y="128" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" >ACCEL_XOUT_H</text>
    <line x1="12" y1="160" x2="140" y2="160" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="172" x2="122" y2="172" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="184" x2="104" y2="184" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="196" x2="86" y2="196" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="118" y="284" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >the datasheet</text>
  <line x1="206" y1="150" x2="262" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <g transform="translate(270 62)">
    <rect width="216" height="176" rx="10" fill="#1e293b"/>
    <text x="16" y="30" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#c084fc" xml:space="preserve">class<tspan fill="#e2e8f0"> Mpu6050 {</tspan></text>
    <text x="16" y="50" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#c084fc" xml:space="preserve">  async<tspan fill="#e2e8f0"> init() {</tspan></text>
    <text x="16" y="70" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#c084fc" xml:space="preserve">    await<tspan fill="#e2e8f0"> write(0x6B, 0x00)</tspan></text>
    <text x="16" y="90" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#c084fc" xml:space="preserve">    const<tspan fill="#e2e8f0"> id = read(0x75)</tspan></text>
    <text x="16" y="110" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#94a3b8" xml:space="preserve">  }<tspan fill="#e2e8f0"></tspan></text>
    <text x="16" y="130" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#5eead4" xml:space="preserve">  measure()<tspan fill="#e2e8f0"> { ... }</tspan></text>
    <text x="16" y="150" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#94a3b8" xml:space="preserve">}<tspan fill="#e2e8f0"></tspan></text>
  </g>
  <text x="378" y="262" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >one driver, in code</text>
  <text x="378" y="48" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >atiic</text>
  <path d="M486 150 C 540 150, 540 96, 580 96" fill="none" stroke="#059669" stroke-width="2"  marker-end="url(#arg)"/>
  <rect x="584" y="70" width="148" height="52" rx="9" fill="#fff" stroke="#059669" stroke-width="1.5" />
  <text x="658" y="92" font-size="13" fill="#334155" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >USB dongle</text>
  <text x="658" y="110" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >the browser, a laptop</text>
  <path d="M486 150 C 540 150, 540 174, 580 174" fill="none" stroke="#059669" stroke-width="2"  marker-end="url(#arg)"/>
  <rect x="584" y="148" width="148" height="52" rx="9" fill="#fff" stroke="#059669" stroke-width="1.5" />
  <text x="658" y="170" font-size="13" fill="#334155" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >a microcontroller</text>
  <text x="658" y="188" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >its own I2C</text>
  <path d="M486 150 C 540 150, 540 252, 580 252" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arg)"/>
  <rect x="584" y="226" width="148" height="52" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="658" y="248" font-size="13" fill="#334155" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >the next adapter</text>
  <text x="658" y="266" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >not yet built</text>
  <text x="658" y="300" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" >the only bus it needs: write, read</text>
</svg>

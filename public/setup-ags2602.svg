    <text x="20" y="390">Yellow jumper on I2C, green on 5V, both before plugging in USB. Four wires: VCC to pin 1, SDA to 2, GND to 3, SCL to 4.</text>
    <text x="20" y="410">It needs 5 V. Pin 1 is at the left with the pins toward you and the sensor up (the manual's Figure 3).</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>Inside the HMC5883L: three magneto-resistive bridges (x, y, z) with an offset strap and a set/reset strap; a chip that picks a bridge, amplifies and converts it to 12 bits, and answers on I2C. One bridge up close: four permalloy strips, a field along the axis unbalances them into a small voltage</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="bg" width="800" height="380" fill="#fff"/>
  <text x="250" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#212121">Inside the HMC5883L</text>
  <text x="250" y="47" text-anchor="middle" font-size="10" fill="#757575">after its datasheet's internal schematic</text>
  <rect x="20" y="60" width="460" height="290" rx="10" fill="none" stroke="#334155" stroke-width="2.5"/>
  <rect x="34" y="74" width="130" height="262" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-dasharray="5 3"/>
  <text x="99" y="92" text-anchor="middle" font-size="11" fill="#6d28d9">sensors (AMR)</text>
  <path d="M78 105 L98 125 L78 145 L58 125 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="78" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">x</text>
  <line x1="98" y1="125" x2="194" y2="122" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <path d="M78 157 L98 177 L78 197 L58 177 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="78" y="181" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">y</text>
  <line x1="98" y1="177" x2="194" y2="145" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <path d="M78 209 L98 229 L78 249 L58 229 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="78" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">z</text>
  <line x1="98" y1="229" x2="194" y2="168" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="46,282 54,290 62,282 70,290 78,282 86,290 94,282 102,290 110,282 118,290 126,282 134,290 142,282 150,290" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="99" y="277" text-anchor="middle" font-size="10" fill="#d97706">offset strap</text>
  <polyline points="46,316 54,324 62,316 70,324 78,316 86,324 94,316 102,324 110,316 118,324 126,316 134,324 142,316 150,324" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="99" y="311" text-anchor="middle" font-size="10" fill="#059669">set/reset strap</text>
  <rect x="180" y="74" width="286" height="262" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="323" y="92" text-anchor="middle" font-size="11" fill="#475569">the chip (ASIC)</text>
  <rect x="196" y="105" width="40" height="80" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="216.0" y="149.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#212121">MUX</text>
  <rect x="256" y="112" width="92" height="66" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="302.0" y="145.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#212121">analog</text>
  <text x="302.0" y="160.0" text-anchor="middle" font-size="10" fill="#424242">amplify, 12-bit ADC</text>
  <rect x="368" y="104" width="84" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="410.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#212121">control</text>
  <text x="410.0" y="179.0" text-anchor="middle" font-size="10" fill="#424242">registers, I²C</text>
  <line x1="236" y1="145" x2="254" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="348" y1="145" x2="366" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="196" y="244" width="120" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="256.0" y="265.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#212121">offset strap driver</text>
  <rect x="196" y="296" width="120" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="256.0" y="317.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#212121">set/reset driver</text>
  <polyline points="368,200 340,200 340,261 318,261" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="368,214 352,214 352,313 318,313" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="196" y1="261" x2="152" y2="286" stroke="#d97706" stroke-width="2"/>
  <line x1="196" y1="313" x2="152" y2="320" stroke="#059669" stroke-width="2"/>
  <text x="258" y="240" text-anchor="middle" font-size="9" fill="#9a3412">the self test: ~1.1 G</text>
  <text x="258" y="292" text-anchor="middle" font-size="9" fill="#065f46">pulses at each reading (C2)</text>
  <line x1="452" y1="130" x2="500" y2="130" stroke="#475569" stroke-width="2"/>
  <text x="504" y="134" font-size="11" fill="#475569">SDA</text>
  <line x1="452" y1="156" x2="500" y2="156" stroke="#475569" stroke-width="2"/>
  <text x="504" y="160" font-size="11" fill="#475569">SCL</text>
  <line x1="452" y1="182" x2="500" y2="182" stroke="#475569" stroke-width="2"/>
  <text x="504" y="186" font-size="11" fill="#475569">DRDY</text>
  <text x="504" y="204" font-size="10" fill="#616161">to the</text><text x="504" y="216" font-size="10" fill="#616161">dongle</text>
  <line x1="560" y1="60" x2="560" y2="350" stroke="#e0e0e0" stroke-width="2"/>
  <text x="680" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#212121">One bridge up close</text>
  <line x1="680" y1="80" x2="610" y2="190.0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="619.0" y="128.0" width="52" height="14" rx="3" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5" transform="rotate(122.5 645.0 135.0)"/>
  <text x="632.1" y="118.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">R+</text>
  <line x1="680" y1="80" x2="750" y2="190.0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="689.0" y="128.0" width="52" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" transform="rotate(57.5 715.0 135.0)"/>
  <text x="727.9" y="118.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">R−</text>
  <line x1="610" y1="190.0" x2="680" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="619.0" y="238.0" width="52" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" transform="rotate(57.5 645.0 245.0)"/>
  <text x="632.1" y="269.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">R−</text>
  <line x1="750" y1="190.0" x2="680" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="689.0" y="238.0" width="52" height="14" rx="3" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5" transform="rotate(122.5 715.0 245.0)"/>
  <text x="727.9" y="269.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">R+</text>
  <circle cx="680" cy="80" r="4" fill="#334155"/><text x="680" y="70" text-anchor="middle" font-size="11" fill="#334155">VDD</text>
  <circle cx="680" cy="300" r="4" fill="#334155"/><text x="680" y="320" text-anchor="middle" font-size="11" fill="#334155">GND</text>
  <circle cx="610" cy="190.0" r="4" fill="#334155"/><circle cx="750" cy="190.0" r="4" fill="#334155"/>
  <line x1="610" y1="190.0" x2="650" y2="190.0" stroke="#334155" stroke-width="1.5"/><line x1="750" y1="190.0" x2="710" y2="190.0" stroke="#334155" stroke-width="1.5"/>
  <circle cx="680" cy="190.0" r="20" fill="#fff" stroke="#334155" stroke-width="1.5"/><text x="680" y="195.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">V</text>
  <line x1="650" y1="190.0" x2="660" y2="190.0" stroke="#334155" stroke-width="1.5"/><line x1="710" y1="190.0" x2="700" y2="190.0" stroke="#334155" stroke-width="1.5"/>
  <line x1="590" y1="330" x2="650" y2="330" stroke="#7c3aed" stroke-width="2" marker-end="url(#f)"/>
  <text x="656" y="334" font-size="11" font-weight="bold" fill="#7c3aed">B along its axis</text>
  <text x="680" y="356" text-anchor="middle" font-size="10" fill="#424242">the strips change resistance opposite ways:</text>
  <text x="680" y="370" text-anchor="middle" font-size="10" fill="#424242">the bridge unbalances, V ≠ 0 (schematic)</text>
</svg>

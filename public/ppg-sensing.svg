<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>A fingertip over the MAX30102: the red and infrared LEDs shine into the skin, light scatters through tissue and blood, some comes back to the photodiode</title>
  <defs>
    <radialGradient id="skin" cx="0.45" cy="0.45" r="0.7"><stop offset="0" stop-color="#f6d2bc"/><stop offset="1" stop-color="#e7b293"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c62828"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7b1fa2"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="640" height="330" fill="#fff"/>
  <!-- the fingertip -->
  <path d="M40 150 C 40 70, 120 40, 260 40 L 600 40 L 600 200 L 260 200 C 150 200, 40 215, 40 150 z" fill="url(#skin)" stroke="#c98d6c" stroke-width="2"/>
  <path d="M520 60 C 540 90, 540 150, 520 180" fill="none" stroke="#d9a080" stroke-width="2"/>
  <!-- blood vessels in it -->
  <path d="M90 170 C 200 150, 320 175, 600 150" fill="none" stroke="#b71c1c" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <path d="M110 120 C 220 110, 360 130, 600 100" fill="none" stroke="#1565c0" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <text x="608" y="154" font-size="11" fill="#7f1414">artery</text>
  <text x="608" y="104" font-size="11" fill="#0d47a1">vein</text>
  <!-- the board -->
  <rect x="150" y="262" width="340" height="18" rx="3" fill="#1b1b1b"/>
  <rect x="200" y="232" width="240" height="32" rx="5" fill="#3a3a3a"/>
  <rect x="216" y="240" width="58" height="18" rx="3" fill="#6b4a3a"/>
  <text x="245" y="253" text-anchor="middle" font-size="9" fill="#fff">photodiode</text>
  <circle cx="352" cy="249" r="9" fill="#e53935" stroke="#fff"/><circle cx="392" cy="249" r="9" fill="#5e35b1" stroke="#fff"/>
  <text x="320" y="300" text-anchor="middle" font-size="12" fill="#333">the sensor's window: a red and an infrared LED, a photodiode</text>
  <!-- light in, scattered, back -->
  <path d="M352 238 C 345 205, 330 185, 300 172" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M392 238 C 395 200, 380 170, 345 158" fill="none" stroke="#7b1fa2" stroke-width="3" marker-end="url(#ai)"/>
  <path d="M290 178 C 270 190, 255 205, 248 236" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <path d="M335 165 C 300 175, 270 195, 262 236" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <g font-size="12">
    <text x="430" y="226" fill="#c62828">red 660 nm, IR 880 nm in</text>
    <text x="40" y="236" fill="#2e7d32">what the blood and</text>
    <text x="40" y="252" fill="#2e7d32">tissue don't absorb, back</text>
  </g>
</svg>

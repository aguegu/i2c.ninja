<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>The differential capacitor: a finger on the mass between two fixed plates; centred, C1 equals C2 and it reads 0; moved toward one plate, that capacitance grows and the other shrinks: the difference is the amount, the bigger one the direction</title>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
    <marker id="grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#455a64"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#757575" stroke-width="2"/></pattern>
  </defs>
  <rect class="bg" width="760" height="330" fill="#fff"/>
  <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#212121">Centred</text>
  <rect x="40" y="62" width="22" height="34" fill="url(#hatch)" stroke="#616161"/>
  <rect x="318" y="62" width="22" height="34" fill="url(#hatch)" stroke="#616161"/>
  <polyline points="62.0,79.0 70.0,79.0 75.2,84.0 80.5,74.0 85.8,84.0 91.0,74.0 96.2,84.0 101.5,74.0 106.8,84.0 112.0,79.0 120.0,79.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="318.0,79.0 310.0,79.0 304.8,74.0 299.5,84.0 294.2,74.0 289.0,84.0 283.8,74.0 278.5,84.0 273.2,74.0 268.0,79.0 260.0,79.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <rect x="120" y="66" width="140" height="26" rx="3" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <text x="190" y="83" text-anchor="middle" font-size="11" fill="#fff">the mass</text>
  <rect x="183" y="92" width="14" height="120" fill="#1f5fa8" stroke="#163f70" stroke-width="1.5"/>
  <rect x="139" y="118" width="14" height="120" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>
  <rect x="133" y="238" width="26" height="14" fill="url(#hatch)" stroke="#616161"/>
  <text x="146" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">C1</text>
  <line x1="154" y1="198" x2="182" y2="198" stroke="#d97706" stroke-width="1.5" marker-start="url(#amber)" marker-end="url(#amber)"/>
  <rect x="227" y="118" width="14" height="120" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>
  <rect x="221" y="238" width="26" height="14" fill="url(#hatch)" stroke="#616161"/>
  <text x="234" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">C2</text>
  <line x1="198" y1="198" x2="226" y2="198" stroke="#d97706" stroke-width="1.5" marker-start="url(#amber)" marker-end="url(#amber)"/>
  <text x="280" y="218" font-size="10" fill="#616161">fixed plates,</text><text x="280" y="231" font-size="10" fill="#616161">anchored</text>
  <text x="190" y="276" text-anchor="middle" font-size="13" fill="#e11d48" font-weight="bold">C1 = C2: reads 0</text>
  <text x="190" y="296" text-anchor="middle" font-size="11" fill="#424242">equal gaps, equal capacitances</text>
  <text x="570" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#212121">Moved by an acceleration</text>
  <rect x="420" y="62" width="22" height="34" fill="url(#hatch)" stroke="#616161"/>
  <rect x="698" y="62" width="22" height="34" fill="url(#hatch)" stroke="#616161"/>
  <polyline points="442.0,79.0 448.6,79.0 452.4,84.0 456.3,74.0 460.1,84.0 464.0,74.0 467.9,84.0 471.7,74.0 475.6,84.0 479.4,79.0 486.0,79.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="698.0,79.0 690.0,79.0 683.0,74.0 676.0,84.0 669.0,74.0 662.0,84.0 655.0,74.0 648.0,84.0 641.0,74.0 634.0,79.0 626.0,79.0" fill="none" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <rect x="486" y="66" width="140" height="26" rx="3" fill="#1f5fa8" stroke="#163f70" stroke-width="2"/>
  <text x="556" y="83" text-anchor="middle" font-size="11" fill="#fff">the mass</text>
  <rect x="549" y="92" width="14" height="120" fill="#1f5fa8" stroke="#163f70" stroke-width="1.5"/>
  <rect x="519" y="118" width="14" height="120" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>
  <rect x="513" y="238" width="26" height="14" fill="url(#hatch)" stroke="#616161"/>
  <text x="526" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">C1</text>
  <line x1="534" y1="198" x2="548" y2="198" stroke="#d97706" stroke-width="1.5" marker-start="url(#amber)" marker-end="url(#amber)"/>
  <rect x="607" y="118" width="14" height="120" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>
  <rect x="601" y="238" width="26" height="14" fill="url(#hatch)" stroke="#616161"/>
  <text x="614" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">C2</text>
  <line x1="564" y1="198" x2="606" y2="198" stroke="#d97706" stroke-width="1.5" marker-start="url(#amber)" marker-end="url(#amber)"/>
  <text x="660" y="218" font-size="10" fill="#616161">fixed plates,</text><text x="660" y="231" font-size="10" fill="#616161">anchored</text>
  <text x="570" y="276" text-anchor="middle" font-size="13" fill="#e11d48" font-weight="bold">C1 > C2: reads the push</text>
  <text x="570" y="296" text-anchor="middle" font-size="11" fill="#424242">the difference: how much; the bigger one: which way</text>
  <line x1="380" y1="20" x2="380" y2="300" stroke="#e0e0e0" stroke-width="2"/>
  <text x="380" y="322" text-anchor="middle" font-size="10" fill="#757575">schematic: one finger of many; the chip has such pairs for each axis</text>
</svg>

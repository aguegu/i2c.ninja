  <g font-size="12" fill="#333">
    <text x="20" y="860">Yellow jumper on I2C, green on 3.3, both before plugging in USB. Four wires: SDA, SCL, GND, VCC (3.3V).</text>
    <text x="20" y="880">TXD and RXD stay free in I2C mode. AD0, INT, XDA, XCL stay free: AD0 low on the GY-521 makes the address 0x68.</text>

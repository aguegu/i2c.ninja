<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 893 400" width="893" height="400" font-family="Helvetica, Arial, sans-serif">
  <style>@media (prefers-color-scheme: dark) { .bg { fill-opacity: 0.85 } }</style>
  <title>A CH341T dongle in I2C mode at 3.3V wired to an SHT20 module: SDA to sda, SCL to scl, GND to gnd, VCC to vcc</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ecef"/>
      <stop offset="0.5" stop-color="#b8bec5"/>
      <stop offset="1" stop-color="#d9dde1"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d77a"/>
      <stop offset="1" stop-color="#b8922a"/>
    </linearGradient>
    <g id="dupont">
      <rect x="0" y="-6" width="20" height="12" rx="1.5" fill="#1b1b1b"/>
      <rect x="2" y="-2" width="4" height="4" fill="#444"/>
    </g>
  </defs>

  <rect class="bg" width="893" height="400" fill="#ffffff"/>
  <text x="446" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">CH341T (I2C mode, 3.3V) + SHT20 module</text>

  <text x="90.42519685039376" y="138.58267716535434" text-anchor="middle" font-size="12" fill="#555">to the PC</text>
  <rect x="19.559055118110308" y="148.58267716535434" width="179.52755905511808" height="122.83464566929133" rx="4" fill="#cfd4da" stroke="#8a9096"/>

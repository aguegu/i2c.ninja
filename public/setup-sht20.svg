  <text x="368.6929133858268" y="206.1968503937008" text-anchor="middle" font-size="9" font-weight="bold" fill="#e5e5e5">CH341T</text>
  <rect x="265.70078740157476" y="155.5748031496063" width="44.40944881889764" height="101.1023622047244" rx="21.732283464566926" fill="#e9ecef" stroke="#8a9096"/>
  <text transform="translate(290.9055118110236 206.1259842519685) rotate(-90)" text-anchor="middle" font-size="8" fill="#555">12.000</text>

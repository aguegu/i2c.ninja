  <rect x="370.5944881889764" y="173.15748031496065" width="3" height="5" fill="#c9ccd1"/><rect x="370.5944881889764" y="228.23622047244095" width="3" height="5" fill="#c9ccd1"/>
  <rect x="377.3976377952756" y="173.15748031496065" width="3" height="5" fill="#c9ccd1"/><rect x="377.3976377952756" y="228.23622047244095" width="3" height="5" fill="#c9ccd1"/>

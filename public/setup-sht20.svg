  <rect x="326.8661417322835" y="133.96850393700788" width="64" height="16" rx="2.5" fill="#000" fill-opacity="0.22" stroke="#0f172a" stroke-width="1"/>
  <rect x="378.3661417322835" y="137.46850393700788" width="9" height="9" fill="#f3d77a" stroke="#b8922a"/>

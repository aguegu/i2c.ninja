  <rect x="472.15748031496065" y="244.0" width="55.84251968503935" height="4" fill="url(#pin)"/>
  <text x="460.15748031496065" y="249.5" text-anchor="end" font-size="9.5" font-weight="bold" fill="#fff">GND</text>
  <circle cx="472.15748031496065" cy="270.0" r="7" fill="#f3d77a" stroke="#b8922a"/>

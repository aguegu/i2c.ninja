  <g transform="translate(33 0)">
  <!-- the AHT30 module (the purple board printed AHT30, from the user's photo:
       pins VIN GND SCL SDA, a mounting hole, the sensor near a corner, a
       regulator, a transistor and a 4.7k resistor array), turned so its
       header faces the dongle -->
  <rect x="612" y="160" width="150" height="140" rx="4" fill="#7b2a8c" stroke="#541c60" stroke-width="2"/>
  <circle cx="726" cy="262" r="17" fill="#fff" stroke="#d9d9d9" stroke-width="4"/>
  <rect x="616" y="186" width="22" height="96" fill="#161616"/>
  <g fill="url(#pin)">
    <rect x="593" y="196" width="34" height="4"/><rect x="593" y="220" width="34" height="4"/>
    <rect x="593" y="244" width="34" height="4"/><rect x="593" y="268" width="34" height="4"/>
  </g>
  <g font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">
    <text x="644" y="202">VIN</text><text x="644" y="226">GND</text><text x="644" y="250">SCL</text><text x="644" y="274">SDA</text>
  </g>
  <!-- the parts: the sensor (its metal-lidded package, the opening), the regulator, a transistor, the resistor array -->
  <rect x="716" y="170" width="34" height="26" rx="2" fill="#d9d9d9" stroke="#888"/>
  <rect x="725" y="178" width="16" height="10" rx="2" fill="#5a5a5a"/>
  <rect x="680" y="172" width="20" height="14" rx="1" fill="#1d1d1d"/>
  <rect x="684" y="226" width="14" height="10" rx="1" fill="#1d1d1d"/>
  <rect x="676" y="200" width="30" height="10" rx="1" fill="#1d1d1d"/>
  <text x="687" y="330" text-anchor="middle" font-size="12" fill="#555">AHT30 module</text>

  <!-- wires, dupont ends on both pins: the module's pins run the other way
       (VIN first), so all four cross: SDA to SDA, SCL to SCL, GND to GND,
       VCC to VIN -->
  <g stroke-linecap="round" fill="none">
    <path d="M495 198 C 540 198, 530 270, 575 270" stroke="#0d4f8c" stroke-width="7"/><path d="M495 198 C 540 198, 530 270, 575 270" stroke="#1e88e5" stroke-width="5"/>
    <path d="M495 222 C 535 222, 535 246, 575 246" stroke="#a88600" stroke-width="7"/><path d="M495 222 C 535 222, 535 246, 575 246" stroke="#f2c200" stroke-width="5"/>
    <path d="M495 246 C 535 246, 535 222, 575 222" stroke="#000" stroke-width="7"/><path d="M495 246 C 535 246, 535 222, 575 222" stroke="#3a3a3a" stroke-width="5"/>
    <path d="M495 270 C 540 270, 530 198, 575 198" stroke="#8e1c1c" stroke-width="7"/><path d="M495 270 C 540 270, 530 198, 575 198" stroke="#d32f2f" stroke-width="5"/>
  </g>
  <use href="#dupont" x="475" y="198"/><use href="#dupont" x="475" y="222"/><use href="#dupont" x="475" y="246"/><use href="#dupont" x="475" y="270"/>
  <use href="#dupont" x="575" y="198"/><use href="#dupont" x="575" y="222"/><use href="#dupont" x="575" y="246"/><use href="#dupont" x="575" y="270"/>

  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="20" y="350">Yellow jumper on I2C, green on 3V3, both before plugging in USB. Four wires, all crossing (the module has VIN first):</text>
    <text x="20" y="370">VCC (3.3 V) to VIN, GND to GND, SCL to SCL, SDA to SDA. Keep it away from warm parts: their heat skews the reading.</text>
  </g>
  </g>
</svg>
